# Envio entity schema for the Freeside sonar belt.
#
# Four entities, because two handlers write them:
#   TrackedErc721.Transfer  -> TrackedHolder (holder counts), Token (per-token owner), Action (event stream)
#   Seaport.OrderFulfilled  -> MintActivity (sales), Action (event stream)
#
# score-api reads `Action` (belt-gateway pull) and `MintActivity` (sale attribution).
# The other 91 entities were orphans of handlers deleted 2026-07-28; removed 2026-07-31.

type Action {
  id: ID!
  actionType: String!
  actor: String!
  primaryCollection: String
  timestamp: BigInt!
  chainId: Int!
  txHash: String!
  numeric1: BigInt
  numeric2: BigInt
  context: String
  # Exact event identity. Nullable because every row written before the
  # 2026-07-31 schema change lacks them, and score-api's bronze schema already
  # types blockNumber as nullable. (timestamp, id) remains the pull keyset;
  # these two give exact intra-block ordering for consumers that need it.
  blockNumber: BigInt
  transactionIndex: Int
}

type TrackedHolder {
  id: ID!
  contract: String!
  collectionKey: String! @index
  chainId: Int!
  address: String! @index
  tokenCount: Int!
}

type Token {
  id: ID!
  collection: String! @index
  chainId: Int!
  tokenId: BigInt!
  owner: String! @index
  isBurned: Boolean! @index
  mintedAt: BigInt!
  lastTransferTime: BigInt!
}

type MintActivity @entity {
  id: ID!                      # txHash_tokenId_user_activityType
  user: String! @index         # User address (lowercase)
  contract: String! @index     # Contract address where activity occurred
  tokenStandard: String!       # "ERC721" | "ERC1155"
  tokenId: BigInt              # Token ID (nullable for some activities)
  quantity: BigInt!            # Quantity (usually 1)
  # Price in the smallest unit of paymentToken, as an exact integer — never a float.
  # ROW TOTAL, not per unit: an ERC-1155 row with quantity 3 carries the price of all
  # 3 units, so unit price is amountPaid / quantity (BB SEA-007). ERC-721 rows always
  # have quantity 1, so the two coincide there.
  # Nullable since bug-20260725-224d57: an unpriced sale is still a real disposal,
  # and dropping it made "sold" and "could not price it" indistinguishable downstream.
  amountPaid: BigInt
  # Settlement currency; zero address = the chain's native coin. Without this,
  # 1000 USDC and 1000 wei are indistinguishable and floor/average price math
  # silently mixes currencies. Null when no price was recoverable.
  paymentToken: String
  activityType: String!        # "MINT" | "SALE" | "PURCHASE"
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
  operator: String             # Operator address (for ERC1155 or marketplace)
  chainId: Int!
}
