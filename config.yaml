# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# GENERATED FILE — do not edit by hand.
# Source of truth: src/registry/contracts.ts. Regenerate with `pnpm gen:config`.
# test/contract-registry.test.ts fails if this file drifts from the registry.
#
# Runtime env vars (read by handlers, not by envio):
#   NATS_URL                  — JetStream connection URI (TLS-only)
#   NATS_TLS_CA               — path to CA bundle for the cluster's NATS instance
#   SONAR_SIGNING_SEED_HEX    — 32-byte (64 hex chars) Ed25519 seed for the
#                               events-pillar signer. Absent → publish layer
#                               stays disabled (fail-soft).
name: thj-indexer
contracts:
  # Every tracked ERC-721. One handler, one binding, no per-community case.
  - name: TrackedErc721
    handler: src/EventHandlers.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)
        field_selection:
          transaction_fields:
            - hash
            # Exact event identity on Action. blockNumber needs no selection
            # (block fields are always on the event); transactionIndex does.
            - transactionIndex
  # Every tracked ERC-1155. Balances are per (contract, chain, tokenId, wallet);
  # TransferBatch is folded into the same path as TransferSingle.
  - name: TrackedErc1155
    handler: src/EventHandlers.ts
    events:
      - event: TransferSingle(address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)
        field_selection:
          transaction_fields:
            - hash
            # Exact event identity on Action. blockNumber needs no selection
            # (block fields are always on the event); transactionIndex does.
            - transactionIndex
      - event: TransferBatch(address indexed operator, address indexed from, address indexed to, uint256[] ids, uint256[] values)
        field_selection:
          transaction_fields:
            - hash
            # Exact event identity on Action. blockNumber needs no selection
            # (block fields are always on the event); transactionIndex does.
            - transactionIndex
  # Every tracked ERC-20. Same topic0 as ERC-721's Transfer — the third arg is
  # un-indexed here, so a contract registered under the wrong standard decodes garbage.
  - name: TrackedErc20
    handler: src/EventHandlers.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
        field_selection:
          transaction_fields:
            - hash
            # Exact event identity on Action. blockNumber needs no selection
            # (block fields are always on the event); transactionIndex does.
            - transactionIndex
  # Seaport (OpenSea) — secondary sales. The OrderFulfilled ABI is stable across
  # versions, so one binding covers v1.1 through v1.6 on every chain.
  - name: Seaport
    handler: src/EventHandlers.ts
    events:
      - event: OrderFulfilled(bytes32 orderHash, address indexed offerer, address indexed zone, address recipient, (uint8,address,uint256,uint256)[] offer, (uint8,address,uint256,uint256,address)[] consideration)
        field_selection:
          transaction_fields:
            - hash
  # Blur — secondary sales, Ethereum only. One matched pair is one NFT: the order
  # carries its own price, currency, collection and tokenId, so no leg-summing.
  - name: Blur
    handler: src/EventHandlers.ts
    events:
      - event: OrdersMatched(address indexed maker, address indexed taker, (address,uint8,address,address,uint256,uint256,address,uint256,uint256,uint256,(uint16,address)[],uint256,bytes) sell, bytes32 sellHash, (address,uint8,address,address,uint256,uint256,address,uint256,uint256,uint256,(uint16,address)[],uint256,bytes) buy, bytes32 buyHash)
        field_selection:
          transaction_fields:
            - hash
