# Secret scanning — TruffleHog + GitLeaks.
#
# Reports, does not block. Both scanners are `continue-on-error` and the summary
# step exits 0 on a hit, because unverified pattern matches in documentation are
# common and a check that blocks on them gets ignored. A VERIFIED hit is loud in
# the run summary and must be acted on: rotate at the provider first — scrubbing
# history does not revoke a key.
name: Secret Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC — full history

permissions:
  contents: read

jobs:
  scan-secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history; TruffleHog needs it for the scheduled scan

      - name: TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          # Diff-scan on PRs; empty base+head puts TruffleHog in full-scan mode on
          # push/schedule, avoiding the BASE==HEAD error that failed every push.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          extra_args: --only-verified --no-update

      - name: GitLeaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        run: |
          if [ "${{ steps.trufflehog.outcome }}" = "failure" ] || [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "::warning title=Possible secret detected::Review the TruffleHog/GitLeaks logs above. If a real credential leaked, ROTATE IT AT THE PROVIDER FIRST — removing it from git history does not revoke it."
          else
            echo "No secrets detected ✓"
          fi
