# CI — the three things that can silently break this indexer.
#
#   1. config.yaml drifting from src/registry/contracts.ts (the registry stops
#      being the single declaration site — the failure bd-dwq5.1 exists to kill).
#   2. envio codegen breaking. EventHandlers.ts was deleted in PR #75 and broke
#      codegen unnoticed until a restore three months later.
#   3. The handler tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  belt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json's `packageManager` field is
      # the single source of pnpm's version, and action-setup@v4 hard-ERRORS when
      # given both ("Multiple versions of pnpm specified"). That collision landed
      # in 08c51665 and made every run since 2026-07-31 fail at this step, ~10s
      # in — before the config-drift check, before codegen, before the tests. Red
      # CI that never reached a real check reads exactly like red CI that did.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: config.yaml is generated from the registry
        run: |
          pnpm gen:config
          git diff --exit-code -- config.yaml \
            || { echo "::error title=config drift::config.yaml differs from what src/registry/contracts.ts generates. Run 'pnpm gen:config' and commit."; exit 1; }

      - name: envio codegen
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
        run: pnpm codegen

      - name: tests
        run: pnpm test
