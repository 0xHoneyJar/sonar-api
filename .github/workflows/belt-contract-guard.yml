# belt-contract-guard — the live drift alarm for sonar's GraphQL read contract.
#
# The wire is the contract; verify it. score-api pulls `Action` and `MintActivity`
# off the belt gateway, and a field that changes or disappears breaks it silently —
# in 2026-06 a `Action_bool_exp` type rename froze one community's sync for 19 days
# before anyone noticed, because every test mocked the wire.
#
# This introspects the LIVE schema on a schedule and fails the moment a
# consumer-depended field drifts, so the producer learns here rather than a
# consumer learning in production.
#
# Scheduled, not per-PR: it hits a live endpoint, so network flake must not gate
# merges. Real drift (exit 1) fails loud; an unreachable endpoint (exit 2) warns.
name: belt-contract-guard

on:
  schedule:
    - cron: "17 13 * * *" # daily ~13:17 UTC
  workflow_dispatch: {} # run on demand

permissions:
  contents: read

jobs:
  verify-live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live belt-gateway contract
        run: |
          set +e
          node scripts/verify-belt-contract.mjs
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error title=belt-gateway contract drift::A consumer-depended field changed or disappeared on the live schema. score-api will break. Fix the producer or update scripts/belt-contract.json + every consumer in lockstep."
            exit 1
          elif [ "$code" = "2" ]; then
            echo "::warning title=belt-gateway unreachable::Could not introspect the live endpoint (transient?). Not failing the guard; re-runs on the next schedule."
            exit 0
          fi
          echo "belt-gateway contract holds ✓"
